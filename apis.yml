aid: imperai
name: Imper.AI
description: >-
  imper.ai is an Israeli workforce identity security company that stops AI-driven
  impersonation, deepfakes, voice clones, and social-engineering attacks in real time
  across enterprise communication channels such as Zoom, Microsoft Teams, Google Meet,
  and Slack. Rather than scanning message content for anomalies, the platform correlates
  hard-to-fake signals — device telemetry, network diagnostics, and behavioral patterns —
  to validate identity at high-risk lifecycle events including hiring, employee enrollment,
  and help-desk verification. Founded by cyber-intelligence veterans and backed by Redpoint
  Ventures and Battery Ventures (about $34M raised), imper.ai integrates with ATS, HRIS, IdP,
  ITSM, PAM, IVR, and meeting platforms, and is deployed across financial, health care, and
  technology enterprises. This profile was seeded from Battery Ventures' portfolio and
  enriched by the API Evangelist pipeline; imper.ai currently publishes a product knowledge
  base rather than a public developer API program.
